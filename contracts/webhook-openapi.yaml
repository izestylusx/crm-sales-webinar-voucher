openapi: 3.0.3
info:
  title: Future Webinar Provider Webhook
  version: 0.1.0
  description: >-
    Optional post-MVP contract for receiving attendance events from a webinar
    provider. This endpoint is not required for the Webinar-first MVP, which
    supports manual and CSV attendance.
servers:
  - url: https://crm.example.internal
paths:
  /v1/webhooks/webinar-provider:
    post:
      summary: Receive an optional provider attendance event
      operationId: receiveWebinarProviderEvent
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderAttendanceEvent'
      responses:
        '202':
          description: Accepted for idempotent processing
        '400':
          description: Invalid payload
        '401':
          description: Invalid signature
        '409':
          description: Event already accepted
components:
  parameters:
    EventId:
      name: X-Event-Id
      in: header
      required: true
      schema:
        type: string
    Signature:
      name: X-Signature
      in: header
      required: true
      schema:
        type: string
  schemas:
    ProviderAttendanceEvent:
      type: object
      required:
        - provider_session_id
        - provider_participant_id
        - attendance_status
        - occurred_at
      properties:
        provider_session_id:
          type: string
        provider_participant_id:
          type: string
        attendance_status:
          type: string
          enum: [attended, no_show]
        joined_at:
          type: string
          format: date-time
        left_at:
          type: string
          format: date-time
        occurred_at:
          type: string
          format: date-time
